<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstração: poda alfa-beta</title>
<style>
  :root {
    --navy: #1a1a1a;
    --navy-dark: #101010;
    --steel: #00518b;
    --gold: #00b8dc;
    --gold-light: #00d0f8;
    --cream: #f1f1f1;
    --ink: #202020;
    --muted: #6f6f6f;
    --line: #dcdcdc;
    --pruned: #c6c6c6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--navy);
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 980px; }
  .card {
    background: #e8e8e8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  .header {
    background: var(--navy);
    color: #fff;
    padding: 30px 36px 26px;
  }
  .logo {
    height: 32px;
    width: auto;
    align-self: flex-start;
    background: #fff;
    padding: 7px 12px;
    border-radius: 6px;
    display: block;
    margin: 0 0 18px;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    font-weight: 600;
    margin: 0 0 8px;
  }
  h1 {
    font-family: Cambria, Georgia, "Times New Roman", serif;
    font-size: 26px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .course {
    font-size: 13px;
    color: #b8b8b8;
    margin: 0;
  }

  .body {
    padding: 32px 36px 36px;
  }
  .tree-wrap { max-width: 700px; margin: 0 auto; }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--cream); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  button.primary:hover:not(:disabled) { background: var(--navy-dark); }
  #step-counter {
    font-size: 13px;
    color: var(--muted);
    min-width: 90px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .log-box {
    max-width: 700px;
    margin: 18px auto 0;
    background: var(--cream);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 14.5px;
    line-height: 1.55;
    min-height: 52px;
    display: flex;
    align-items: center;
  }
  .log-box b { color: var(--steel); }

  .legend {
    max-width: 700px;
    margin: 14px auto 0;
    display: flex;
    gap: 22px;
    font-size: 12px;
    color: var(--muted);
    justify-content: center;
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; display: inline-block; margin-right: 6px; }
</style>
</head>

      <p class="kicker">INTELIGÊNCIA ARTIFICIAL</p>
      <h1>Poda alfa-beta - demonstração visual</h1>
      <p class="course">Profa. Katherine B. E. de Vargas</p>
    </div>

    <div class="body">
      <div class="tree-wrap">
        <svg id="tree" width="100%" viewBox="0 0 680 380"></svg>
      </div>

      <div class="controls">
        <button id="reset">Reiniciar</button>
        <button id="prev">← Anterior</button>
        <button id="play" class="primary">▶ Reproduzir</button>
        <button id="next">Próximo →</button>
        <span id="step-counter">Passo 0 de 0</span>
      </div>

      <div class="log-box" id="log"></div>

      <div class="legend">
        <span><span class="swatch" style="background:#eef4fa;border:1px solid var(--steel)"></span> nó ativo</span>
        <span><span class="swatch" style="background:#f1f1f1;border:1px solid var(--line)"></span> explorado</span>
        <span><span class="swatch" style="background:#fafafa;border:1px dashed var(--pruned)"></span> podado (nunca avaliado)</span>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  // 1. Árvore de exemplo 
  const tree = {
    id: 'root', type: 'MAX', label: 'MAX (raiz)',
    children: [
      { id: 'A', type: 'MIN', label: 'MIN A', children: [
        { id: 'A0', type: 'LEAF', value: 3 },
        { id: 'A1', type: 'LEAF', value: 12 },
        { id: 'A2', type: 'LEAF', value: 8 },
      ]},
      { id: 'B', type: 'MIN', label: 'MIN B', children: [
        { id: 'B0', type: 'LEAF', value: 2 },
        { id: 'B1', type: 'LEAF', value: 4 },
        { id: 'B2', type: 'LEAF', value: 6 },
      ]},
      { id: 'C', type: 'MIN', label: 'MIN C', children: [
        { id: 'C0', type: 'LEAF', value: 14 },
        { id: 'C1', type: 'LEAF', value: 5 },
        { id: 'C2', type: 'LEAF', value: 2 },
      ]},
    ],
  };

  const labels = { root: 'MAX (raiz)', A: 'MIN A', B: 'MIN B', C: 'MIN C' };
  const leafValues = {};
  tree.children.forEach(m => m.children.forEach(l => { leafValues[l.id] = l.value; }));
  function labelOf(id) {
    if (labels[id]) return labels[id];
    return 'folha (' + leafValues[id] + ')';
  }
  function fmt(n) { return n === Infinity ? '+∞' : (n === -Infinity ? '−∞' : n); }

  // 2. Executa alfa-beta de verdade, gravando cada passo 
  const steps = [];
  function alphabeta(node, alpha, beta) {
    if (node.type === 'LEAF') {
      steps.push({ type: 'leaf', id: node.id, value: node.value });
      return node.value;
    }
    steps.push({ type: 'enter', id: node.id, kind: node.type, alpha, beta });
    let best = node.type === 'MAX' ? -Infinity : Infinity;
    for (let i = 0; i < node.children.length; i++) {
      const child = node.children[i];
      const val = alphabeta(child, alpha, beta);
      if (node.type === 'MAX') {
        best = Math.max(best, val);
        alpha = Math.max(alpha, best);
      } else {
        best = Math.min(best, val);
        beta = Math.min(beta, best);
      }
      steps.push({ type: 'update', id: node.id, kind: node.type, childId: child.id, childVal: val, best, alpha, beta });
      if (beta <= alpha) {
        const remaining = node.children.slice(i + 1).map(c => c.id);
        if (remaining.length) steps.push({ type: 'prune', id: node.id, prunedIds: remaining, alpha, beta });
        break;
      }
    }
    steps.push({ type: 'return', id: node.id, value: best });
    return best;
  }
  const finalValue = alphabeta(tree, -Infinity, Infinity);
  steps.push({ type: 'done', value: finalValue });

  // 3. Mensagens em português por tipo de passo
  function messageFor(step) {
    switch (step.type) {
      case 'enter':
        return labelOf(step.id) + ' &mdash; entra com <b>α = ' + fmt(step.alpha) + '</b>, <b>β = ' + fmt(step.beta) + '</b>';
      case 'leaf':
        return 'Folha com valor <b>' + step.value + '</b> &mdash; estado terminal, UTILITY = ' + step.value;
      case 'update': {
        const abLabel = step.kind === 'MAX' ? 'α' : 'β';
        const abVal = step.kind === 'MAX' ? step.alpha : step.beta;
        return labelOf(step.id) + ' recebe <b>' + step.childVal + '</b> de ' + labelOf(step.childId) +
          '. Melhor valor até agora: <b>' + step.best + '</b>. ' + abLabel + ' atualizado para <b>' + fmt(abVal) + '</b>.';
      }
      case 'prune':
        return 'β (' + fmt(step.beta) + ') ≤ α (' + fmt(step.alpha) + ') em ' + labelOf(step.id) +
          ' &mdash; <b>poda!</b> ' + step.prunedIds.map(labelOf).join(', ') +
          (step.prunedIds.length > 1 ? ' nunca serão avaliados.' : ' nunca será avaliado.');
      case 'return':
        return labelOf(step.id) + ' retorna o valor <b>' + step.value + '</b> para o nó pai.';
      case 'done':
        return '<b>Busca concluída.</b> Valor da raiz = ' + step.value + ' &mdash; MAX deveria escolher o ramo A.';
    }
    return '';
  }

  //  4. Layout dos nós 
  const layout = {
    root: { x: 290, y: 20, w: 100, h: 56 },
    A:    { x: 105, y: 140, w: 90, h: 56 },
    B:    { x: 295, y: 140, w: 90, h: 56 },
    C:    { x: 485, y: 140, w: 90, h: 56 },
    A0: { x: 73,  y: 260, w: 46, h: 40 },
    A1: { x: 127, y: 260, w: 46, h: 40 },
    A2: { x: 181, y: 260, w: 46, h: 40 },
    B0: { x: 263, y: 260, w: 46, h: 40 },
    B1: { x: 317, y: 260, w: 46, h: 40 },
    B2: { x: 371, y: 260, w: 46, h: 40 },
    C0: { x: 453, y: 260, w: 46, h: 40 },
    C1: { x: 507, y: 260, w: 46, h: 40 },
    C2: { x: 561, y: 260, w: 46, h: 40 },
  };
  const edges = [
    ['root', 'A'], ['root', 'B'], ['root', 'C'],
    ['A', 'A0'], ['A', 'A1'], ['A', 'A2'],
    ['B', 'B0'], ['B', 'B1'], ['B', 'B2'],
    ['C', 'C0'], ['C', 'C1'], ['C', 'C2'],
  ];
  function center(id) {
    const b = layout[id];
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  // 5. Estado acumulado até um passo
  const svg = document.getElementById('tree');
  const logEl = document.getElementById('log');
  const counterEl = document.getElementById('step-counter');
  let current = -1; // nenhum passo aplicado ainda
  let playing = false;
  let playTimer = null;

  function computeState(uptoIndex) {
    const st = {};
    Object.keys(layout).forEach(id => { st[id] = { status: 'idle' }; });
    for (let i = 0; i <= uptoIndex; i++) {
      const s = steps[i];
      if (s.type === 'enter') st[s.id] = { status: 'active', alpha: s.alpha, beta: s.beta, kind: s.kind };
      else if (s.type === 'leaf') st[s.id] = { status: 'done', value: s.value };
      else if (s.type === 'update') st[s.id] = Object.assign({}, st[s.id], { alpha: s.alpha, beta: s.beta, best: s.best });
      else if (s.type === 'prune') s.prunedIds.forEach(pid => { st[pid] = { status: 'pruned' }; });
      else if (s.type === 'return') st[s.id] = Object.assign({}, st[s.id], { status: 'done', value: s.value });
    }
    return st;
  }

  function esc(s) { return String(s); }

  function render() {
    const idx = current;
    const state = computeState(idx);
    const step = idx >= 0 ? steps[idx] : null;
    const activeIds = new Set();
    if (step) {
      if (step.id) activeIds.add(step.id);
      if (step.childId) activeIds.add(step.childId);
    }

    let svgParts = [];

    // edges
    edges.forEach(([from, to]) => {
      const c1 = center(from), c2 = center(to);
      const toState = state[to] && state[to].status;
      const fromBox = layout[from], toBox = layout[to];
      const x1 = c1.x, y1 = fromBox.y + fromBox.h;
      const x2 = c2.x, y2 = toBox.y;
      const pruned = toState === 'pruned';
      const color = pruned ? '#c6c6c6' : '#9aa5b1';
      const dash = pruned ? 'stroke-dasharray="3 3"' : '';
      svgParts.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="1" ' + dash + '/>');
    });

    // nodes
    Object.keys(layout).forEach(id => {
      const b = layout[id];
      const s = state[id] || { status: 'idle' };
      const isLeaf = leafValues.hasOwnProperty(id);
      const isActiveNow = activeIds.has(id);

      let fill = '#ffffff', stroke = '#dcdcdc', strokeW = 1;
      if (s.status === 'pruned') { fill = '#fafafa'; stroke = '#c6c6c6'; }
      else if (s.status === 'active' || (isLeaf && isActiveNow)) { fill = '#eef4fa'; stroke = '#00518b'; strokeW = 1.5; }
      else if (s.status === 'done') { fill = '#f1f1f1'; stroke = '#b7bcc4'; }
      if (isActiveNow) { stroke = '#00518b'; strokeW = 2; }

      svgParts.push('<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h +
        '" rx="8" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/>');

      if (isLeaf) {
        const textColor = s.status === 'pruned' ? '#b7bcc4' : '#202020';
        svgParts.push('<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + b.h / 2) +
          '" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="' + textColor + '" font-family="Segoe UI, Arial, sans-serif">' +
          leafValues[id] + '</text>');
      } else {
        const title = labelOf(id);
        svgParts.push('<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + b.h * 0.35) +
          '" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#202020" font-family="Segoe UI, Arial, sans-serif">' +
          title + '</text>');
        let sub = '';
        if (s.status === 'done' && s.value !== undefined) sub = 'valor = ' + s.value;
        else if (s.alpha !== undefined) sub = 'α=' + fmt(s.alpha) + '  β=' + fmt(s.beta);
        if (sub) {
          svgParts.push('<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + b.h * 0.72) +
            '" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#00518b" font-family="Consolas, monospace">' +
            sub + '</text>');
        }
      }
    });

    svg.innerHTML = svgParts.join('');

    // log + controls
    logEl.innerHTML = step ? messageFor(step) : 'Clique em <b>Próximo</b> para começar a demonstração da poda alfa-beta.';
    counterEl.textContent = 'Passo ' + (idx + 1 < 0 ? 0 : idx + 1) + ' de ' + steps.length;
    document.getElementById('prev').disabled = idx <= -1;
    document.getElementById('next').disabled = idx >= steps.length - 1;
  }

  function goNext() {
    if (current < steps.length - 1) { current++; render(); }
    else stopPlaying();
  }
  function goPrev() {
    if (current > -1) { current--; render(); }
  }
  function reset() {
    current = -1;
    stopPlaying();
    render();
  }
  function stopPlaying() {
    playing = false;
    clearInterval(playTimer);
    document.getElementById('play').textContent = '▶ Reproduzir';
  }
  function togglePlay() {
    if (playing) { stopPlaying(); return; }
    if (current >= steps.length - 1) current = -1;
    playing = true;
    document.getElementById('play').textContent = '⏸ Pausar';
    playTimer = setInterval(() => {
      if (current >= steps.length - 1) { stopPlaying(); return; }
      goNext();
    }, 1400);
  }

  document.getElementById('next').addEventListener('click', () => { stopPlaying(); goNext(); });
  document.getElementById('prev').addEventListener('click', () => { stopPlaying(); goPrev(); });
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('play').addEventListener('click', togglePlay);

  render();
})();
</script>
</body>
</html>
